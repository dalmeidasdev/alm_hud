<!doctype html>
<html lang="pt-BR">
    <head>
        <meta charset="utf-8" />
        <link rel="stylesheet" href="style.css" />
        <script src="app.js" defer></script>
    </head>
    <body>
        <svg class="defs" aria-hidden="true">
            <defs>
                <radialGradient id="face" cx="50%" cy="38%" r="70%">
                    <stop offset="0" class="stop-face-in" />
                    <stop offset="0.55" class="stop-face-mid" />
                    <stop offset="1" class="stop-face-out" />
                </radialGradient>
                <linearGradient id="bezel" x1="0" y1="0" x2="1" y2="1">
                    <stop offset="0" class="stop-bezel-light" />
                    <stop offset="0.5" class="stop-bezel-dark" />
                    <stop offset="1" class="stop-bezel-light" />
                </linearGradient>
            </defs>
        </svg>

        <div id="hud" class="hidden">
            <!-- canto superior direito: marca, id, relógio, dinheiro e emprego -->
            <section class="top">
                <div class="brand">
                    <div class="brand-text">
                        <b id="server-name" class="display" data-part="name"></b>
                        <div class="chips">
                            <span class="chip" data-part="id"><span id="label-id" class="label"></span><b id="player-id" class="display"></b></span>
                            <span class="chip" data-part="clock">
                                <svg viewBox="0 0 24 24" aria-hidden="true">
                                    <path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20Zm1 5v4.600l3.200 3.200-1.400 1.400L11 12.400V7h2Z" />
                                </svg>
                                <b id="clock" class="display">00:00</b>
                            </span>
                        </div>
                    </div>
                </div>
                <div class="money" data-part="cash">
                    <i id="cash-delta" class="delta display"></i>
                    <span class="money-icon">
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M21 7H5a1 1 0 0 1 0-2h14V3H5a3 3 0 0 0-3 3v12a3 3 0 0 0 3 3h16a1 1 0 0 0 1-1V8a1 1 0 0 0-1-1Zm-3 8.500a1.500 1.500 0 1 1 0-3 1.500 1.500 0 0 1 0 3Z" />
                        </svg>
                    </span>
                    <span id="label-cash" class="label"></span>
                    <b id="cash" class="display"></b>
                </div>
                <div class="money" data-part="bank">
                    <i id="bank-delta" class="delta display"></i>
                    <span class="money-icon">
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M12 2 2 7v2h20V7L12 2ZM4 11v7h3v-7H4Zm6.500 0v7h3v-7h-3Zm6.500 0v7h3v-7h-3ZM2 20v2h20v-2H2Z" />
                        </svg>
                    </span>
                    <span id="label-bank" class="label"></span>
                    <b id="bank" class="display"></b>
                </div>
                <div id="job" class="job hidden" data-part="job">
                    <i class="duty-dot"></i>
                    <b id="job-label" class="display"></b>
                    <span id="job-duty" class="label"></span>
                </div>
            </section>

            <!-- canto inferior esquerdo: status, rua e bairro -->
            <section class="left">
                <div class="place" data-part="place">
                    <b id="direction" class="display"></b>
                    <div>
                        <span id="street"></span>
                        <span id="zone" class="label"></span>
                    </div>
                </div>
                <div class="vitals">
                    <div id="v-health" class="vital" data-tone="health">
                        <svg class="ring" viewBox="0 0 40 40" aria-hidden="true">
                            <circle class="ring-bg" cx="20" cy="20" r="17" />
                            <circle class="ring-fg" cx="20" cy="20" r="17" pathLength="100" />
                        </svg>
                        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M12 21s-7.500-4.600-10-9.300C.300 8.300 2 4 6 4c2.200 0 3.600 1.200 6 3.500C14.400 5.200 15.800 4 18 4c4 0 5.700 4.300 4 7.700C19.500 16.400 12 21 12 21Z" />
                        </svg>
                        <em></em>
                    </div>
                    <div id="v-armor" class="vital hidden" data-tone="armor">
                        <svg class="ring" viewBox="0 0 40 40" aria-hidden="true">
                            <circle class="ring-bg" cx="20" cy="20" r="17" />
                            <circle class="ring-fg" cx="20" cy="20" r="17" pathLength="100" />
                        </svg>
                        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M12 2 4 5v6c0 5 3.400 9.300 8 11 4.600-1.700 8-6 8-11V5l-8-3Z" />
                        </svg>
                        <em></em>
                    </div>
                    <div id="v-hunger" class="vital hidden" data-tone="hunger" data-part="hunger">
                        <svg class="ring" viewBox="0 0 40 40" aria-hidden="true">
                            <circle class="ring-bg" cx="20" cy="20" r="17" />
                            <circle class="ring-fg" cx="20" cy="20" r="17" pathLength="100" />
                        </svg>
                        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M7 2v7a2 2 0 0 0 2 2v11h2V11a2 2 0 0 0 2-2V2h-2v6h-1V2H8v6H7V2Zm9 0c-1.700 0-3 2.200-3 5v6h2v9h2V2h-1Z" />
                        </svg>
                        <em></em>
                    </div>
                    <div id="v-thirst" class="vital hidden" data-tone="thirst" data-part="thirst">
                        <svg class="ring" viewBox="0 0 40 40" aria-hidden="true">
                            <circle class="ring-bg" cx="20" cy="20" r="17" />
                            <circle class="ring-fg" cx="20" cy="20" r="17" pathLength="100" />
                        </svg>
                        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M12 2s-7 7.600-7 12.500a7 7 0 0 0 14 0C19 9.600 12 2 12 2Z" />
                        </svg>
                        <em></em>
                    </div>
                    <div id="v-stamina" class="vital hidden" data-tone="soft" data-part="stamina">
                        <svg class="ring" viewBox="0 0 40 40" aria-hidden="true">
                            <circle class="ring-bg" cx="20" cy="20" r="17" />
                            <circle class="ring-fg" cx="20" cy="20" r="17" pathLength="100" />
                        </svg>
                        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M13 2 4 14h6l-1 8 9-12h-6l1-8Z" />
                        </svg>
                        <em></em>
                    </div>
                    <div id="v-oxygen" class="vital hidden" data-tone="soft" data-part="oxygen">
                        <svg class="ring" viewBox="0 0 40 40" aria-hidden="true">
                            <circle class="ring-bg" cx="20" cy="20" r="17" />
                            <circle class="ring-fg" cx="20" cy="20" r="17" pathLength="100" />
                        </svg>
                        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M8 14a4 4 0 1 0 0 8 4 4 0 0 0 0-8Zm8-6a3 3 0 1 0 0 6 3 3 0 0 0 0-6ZM9 2a2.500 2.500 0 1 0 0 5 2.500 2.500 0 0 0 0-5Z" />
                        </svg>
                        <em></em>
                    </div>
                    <div id="v-voice" class="vital voice" data-tone="voice" data-part="voice">
                        <svg class="ring" viewBox="0 0 40 40" aria-hidden="true">
                            <circle class="ring-bg" cx="20" cy="20" r="17" />
                            <circle class="ring-fg" cx="20" cy="20" r="17" pathLength="100" />
                        </svg>
                        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3Zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.900V22h2v-3.100A7 7 0 0 0 19 12h-2Z" />
                        </svg>
                        
                    </div>
                    <div id="v-radio" class="vital radio hidden" data-tone="voice" data-part="voice">
                        <svg class="ring" viewBox="0 0 40 40" aria-hidden="true">
                            <circle class="ring-bg" cx="20" cy="20" r="17" />
                            <circle class="ring-fg" cx="20" cy="20" r="17" pathLength="100" />
                        </svg>
                        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M9 2h2v5h6a2 2 0 0 1 2 2v11a2 2 0 0 1-2 2H9a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2V2Zm1 8v3h6v-3h-6Zm0 6v2h2v-2h-2Zm4 0v2h2v-2h-2Z" />
                        </svg>
                        <em id="radio-label"></em>
                    </div>
                </div>
            </section>

            <!-- canto inferior direito: munição da arma na mão (sobe para cima do painel ao dirigir) -->
            <section id="weapon" class="weapon hidden" data-part="weapon">
                <div class="weapon-text">
                    <div class="ammo">
                        <b id="ammo-clip" class="display"></b>
                        <span id="ammo-reserve" class="display"></span>
                    </div>
                </div>
                <span class="weapon-icon">
                    <svg class="gun" viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M2 6h17v1h3v4h-8.500a2.500 2.500 0 0 1-2.500 2.500H9.500L8 20H3l2-7.500V11H2V6Z" />
                    </svg>
                </span>
            </section>

            <!-- canto inferior direito: painel do veículo -->
            <section id="cluster" class="cluster hidden">
                <div class="gauge-wrap">
                <svg class="gauges" viewBox="0 0 330 210" aria-hidden="true">
                    <!-- conta-giros -->
                    <g class="gauge">
                        <circle cx="72" cy="128" r="68" fill="url(#bezel)" />
                        <circle cx="72" cy="128" r="64" fill="url(#face)" />
                        <g id="rpm-ticks"></g>
                        <path id="rpm-red" class="redline" />
                        <text class="unit" x="72" y="104">x1000</text>
                        <text class="unit small" x="72" y="113">RPM</text>
                        <rect class="gear-box" x="56" y="150" width="32" height="26" rx="3" />
                        <text id="gear" class="gear" x="72" y="170">N</text>
                    </g>

                    <!-- velocímetro -->
                    <g class="gauge">
                        <circle cx="222" cy="104" r="102" fill="url(#bezel)" />
                        <circle cx="222" cy="104" r="97" fill="url(#face)" />
                        <circle class="trail-track" cx="222" cy="104" r="93" pathLength="360" />
                        <circle id="dial-speed" class="trail" cx="222" cy="104" r="93" pathLength="360" />
                        <g id="dial-ticks"></g>
                        <rect class="readout-box" x="188" y="136" width="68" height="40" rx="4" />
                        <text id="speed" class="speed" x="222" y="162">0</text>
                        <text id="label-speed" class="unit" x="222" y="173"></text>
                    </g>
                </svg>
                <!-- os ponteiros ficam fora do SVG: girar um elemento próprio não repinta o mostrador -->
                <div id="rpm-needle" class="needle rpm"><i></i><b></b></div>
                <div id="needle" class="needle speed"><i></i><b></b></div>
                </div>
                <div class="dash">
                    <div class="lamps">
                        <svg id="lamp-belt" class="lamp hidden" viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M7 3h10a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2Zm0 2v9.200L16.200 5H7Zm10 1.800L7 16.800V19h10V6.800Z" />
                        </svg>
                        <svg id="lamp-lock" class="lamp" viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M7 10h10a2 2 0 0 1 2 2v7a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2ZM11 14v4h2v-4h-2ZM8 10V7a4 4 0 0 1 8 0v3h-2V7a2 2 0 0 0-4 0v3H8Z" />
                        </svg>
                        <svg id="lamp-lights" class="lamp" viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M3 12a7 7 0 0 1 7-7h1v14h-1a7 7 0 0 1-7-7Zm11-6h7v2h-7V6Zm0 5h7v2h-7v-2Zm0 5h7v2h-7v-2Z" />
                        </svg>
                        <svg id="lamp-engine" class="lamp" viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M7 6h6v2h2l2 3h2v-1h2v7h-2v-1h-2l-2 3H8l-3-3v-2H3v-4h2V9l2-1V6Z" />
                        </svg>
                        <svg id="lamp-brake" class="lamp" viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18Zm0 2a7 7 0 1 1 0 14 7 7 0 0 1 0-14Zm-2 3v8h2v-3h1.500a2.500 2.500 0 0 0 0-5H10Zm2 2h1.500a.500.500 0 0 1 0 1H12v-1Z" />
                        </svg>
                    </div>
                    <div id="fuel-box" class="fuel hidden" data-part="fuel">
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M6 3h6a2 2 0 0 1 2 2v16H4V5a2 2 0 0 1 2-2ZM6 6v4h6V6H6ZM14 11h2a2 2 0 0 1 2 2v5a1 1 0 0 0 2 0V9l-2.5-2.5 1.4-1.4L22 8.2V18a3 3 0 0 1-6 0v-5h-2v-2Z" />
                        </svg>
                        <span class="label">E</span>
                        <div class="track"><div id="fuel" class="fill"></div></div>
                        <span class="label">F</span>
                        <b id="fuel-value" class="display"></b>
                    </div>
                </div>
            </section>
        </div>
    </body>
</html>
